# Debian 12 (bookworm) Apache web server (LX-SERVER) - unattended install via preseed
# Boot line:  auto=true priority=critical hostname=lx-server domain=lab.local url=<URL of this file>
# The router must already be running (DHCP + NAT), because the installer
# gets its address and its internet access through it.

# --- Locale / keyboard / clock ---
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Prague
d-i clock-setup/utc boolean true

# --- Network during install (DHCP from the router) ---
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 60

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false

# --- Accounts: root login disabled, one sudo user ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Lab Admin
d-i passwd/username string labadmin
# Plain-text lab password. Change it with `passwd` after first login.
d-i passwd/user-password password Heslo123
d-i passwd/user-password-again password Heslo123
d-i user-setup/encrypt-home boolean false

# --- Partitioning: whole disk, single partition (wipes the virtual disk!) ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Packages ---
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo apache2 curl
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Bootloader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# --- Web server configuration (runs inside the new system, log in /root/late.log) ---
d-i preseed/late_command string \
  wget -O /target/root/postinstall-web.sh https://raw.githubusercontent.com/YOURUSER/YOURREPO/main/postinstall-web.sh > /target/root/late.log 2>&1 ; \
  in-target bash /root/postinstall-web.sh >> /target/root/late.log 2>&1

# Reboot into the installed system when done
d-i finish-install/reboot_in_progress note
